name: Glitch Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanity check repo layout
        run: |
          echo "node: $(node -v)"
          echo "workspace: $GITHUB_WORKSPACE"
          echo "--- repo root ---"
          ls -la
          echo "--- src/ ---"
          ls -la src || echo "MISSING: src/ directory not found"
          test -f src/generate.mjs && echo "FOUND src/generate.mjs" || echo "MISSING: src/generate.mjs not found at expected path"

      - name: Generate github-snake-hacker.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::STATS_TOKEN secret is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node src/generate.mjs --login parasbishnoi029 --out dist/github-snake-hacker.svg
          echo "--- dist/ after generate ---"
          ls -la dist
          test -f dist/github-snake-hacker.svg || (echo "::error::generate.mjs ran but did not produce dist/github-snake-hacker.svg" && exit 1)

      - name: Publish to output branch (without wiping it)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add /tmp/out-branch origin/output
            cd /tmp/out-branch
            git checkout -B output
          else
            git worktree add --orphan -B output /tmp/out-branch
            cd /tmp/out-branch
          fi

          cp "$GITHUB_WORKSPACE/dist/github-snake-hacker.svg" ./github-snake-hacker.svg
          git add github-snake-hacker.svg

          if git diff --cached --quiet; then
            echo "no visual change, skipping commit"
          else
            git commit -m "generate: glitch snake $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:output
          fi
