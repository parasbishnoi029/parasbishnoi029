name: Glitch Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-hacker.svg?palette=github-dark&color_snake=#ff2b6d&color_dots=#0a0a0a,#123d24,#1f7a3f,#26d36a,#39ffa0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch (without wiping it)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add /tmp/out-branch origin/output
            cd /tmp/out-branch
            git checkout -B output
          else
            git worktree add --orphan -B output /tmp/out-branch
            cd /tmp/out-branch
          fi

          cp "$GITHUB_WORKSPACE/dist/github-snake-hacker.svg" ./github-snake-hacker.svg
          git add github-snake-hacker.svg

          if git diff --cached --quiet; then
            echo "no visual change, skipping commit"
          else
            git commit -m "generate: snake $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:output
          fi
