name: Generate Glitch Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Decode Base64 Generator & Execute
        run: |
          # The base64 payload contains the full generation logic for the ASCII snake, 
          # chromatic aberration filters, decay trails, and kernel panic background.
          echo "" | base64 --decode > generate.mjs
          
          # Execute the decoded script
          node generate.mjs

      - name: Push to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update kernel panic snake graph [skip ci]"
