name: Glitch Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate base snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: parasbishnoi029
          outputs: |
            dist/base-snake.svg?palette=github-dark&color_snake=#ff2b6d&color_dots=#0a0a0a,#123d24,#1f7a3f,#26d36a,#39ffa0
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Glitch-ify the SVG (CRT background + neon glow + scanlines)
        run: |
          # Fix permission issue caused by the Docker action running as root
          sudo chown -R $USER:$USER dist
          
          python3 << 'PYEOF'
          import re

          svg = open("dist/base-snake.svg", encoding="utf-8").read()

          m = re.search(r'viewBox="0 0 ([\d.]+) ([\d.]+)"', svg)
          if m:
              W, H = float(m.group(1)), float(m.group(2))
          else:
              mw = re.search(r'width="([\d.]+)"', svg)
              mh = re.search(r'height="([\d.]+)"', svg)
              W, H = float(mw.group(1)), float(mh.group(1))

          defs = f'''<defs>
            <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.6" result="b1"/>
              <feGaussianBlur stdDeviation="3.2" result="b2"/>
              <feMerge>
                <feMergeNode in="b2"/>
                <feMergeNode in="b1"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <pattern id="scan" width="{W}" height="6" patternUnits="userSpaceOnUse">
              <rect width="{W}" height="1" y="3" fill="rgba(0,0,0,0.4)"/>
              <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 600" dur="4.5s" repeatCount="indefinite"/>
            </pattern>
            <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
              <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
              <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="{W}" height="{H}" fill="#030503"/>
          '''

          svg2 = re.sub(r'(<svg[^>]*>)', r'\1' + defs, svg, count=1)
          close_idx = svg2.rfind("</svg>")
          body_start = svg2.find(defs) + len(defs)
          body = svg2[body_start:close_idx]

          overlay = (
              f'<rect x="0" y="0" width="{W}" height="{H}" fill="url(#scan)" '
              f'style="mix-blend-mode:multiply" pointer-events="none"/>'
              f'<rect x="0" y="0" width="{W}" height="{H}" fill="url(#vignette)" pointer-events="none"/>'
          )

          new_svg = (
              svg2[:body_start]
              + f'<g filter="url(#neonGlow)">{body}</g>'
              + overlay
              + svg2[close_idx:]
          )

          open("dist/github-snake-hacker.svg", "w", encoding="utf-8").write(new_svg)
          print(f"wrote dist/github-snake-hacker.svg ({len(new_svg)} bytes)")
          PYEOF
          ls -la dist
          test -f dist/github-snake-hacker.svg || (echo "::error::post-processing failed to write the file" && exit 1)

      - name: Publish to output branch (without wiping it)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add /tmp/out-branch origin/output
            cd /tmp/out-branch
            git checkout -B output
          else
            git worktree add --orphan -B output /tmp/out-branch
            cd /tmp/out-branch
          fi

          cp "$GITHUB_WORKSPACE/dist/github-snake-hacker.svg" ./github-snake-hacker.svg
          git add github-snake-hacker.svg

          if git diff --cached --quiet; then
            echo "no visual change, skipping commit"
          else
            git commit -m "generate: glitch snake $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:output
          fi
