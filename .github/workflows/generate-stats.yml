name: Generate Stats Assets (self-hosted)

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generates the streak SVG using GitHub's own API directly,
      # inside this job. No call to streak-stats.demolab.com at all.
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: assets/stats-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git pull --rebase origin main
          git push

  languages:
    needs: streak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generates the top-languages SVG the same way — computed inside
      # this job using GITHUB_TOKEN, not fetched from a shared public host.
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: assets/stats-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update top languages card"
          git pull --rebase origin main
          git push
