name: Glitch Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs once a day at midnight UTC
  workflow_dispatch:    # Allows manual running from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Glitch Snake
        uses: Platane/snk@v3
        with:
          github_user_name: parasbishnoi029
          outputs: |
            github-snake-hacker.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push to output branch
        run: |
          # Set up bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to the output branch
          git checkout -B output
          
          # Add the newly generated snake file
          git add github-snake-hacker.svg
          
          # Commit the file (or exit gracefully if no changes were made)
          git commit -m "generate: glitch snake" || exit 0
          
          # Force push to the output branch to bypass any Git lock/collision errors
          git push -f origin output
