name: Generate Stats Assets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-overview.svg
          base: "header, activity, community, repositories, metadata"

      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg
          git diff --staged --quiet || git commit -m "chore: update stats overview"
          git pull --rebase origin main
          git push

  activity:
    needs: overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity dashboard SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/activity-dashboard.svg
          base: ""
          plugin_activity: "yes"
          plugin_activity_days: "14"
          plugin_activity_limit: "5"

      - name: Commit activity dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dashboard.svg
          git diff --staged --quiet || git commit -m "chore: update activity dashboard"
          git pull --rebase origin main
          git push

  custom_designs:
    needs: activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This is the hardened version of update_custom_svgs.py:
      #   - retries each upstream fetch a few times
      #   - detects an upstream error card instead of trusting any 200 response
      #   - leaves the existing animated SVGs untouched if the fetch fails,
      #     instead of overwriting them with zeros/blanks
      #   - fails the job loudly (red X) when a fetch can't be completed,
      #     so you know your animated streak/language cards are stale
      # Fully native: talks straight to api.github.com/graphql using the
      # token below. No streak-stats.demolab.com, no
      # github-readme-stats.vercel.app, no self-hosted deployment needed.
      - name: Compute stats natively and inject into custom animated templates
        env:
          GH_USERNAME: parasbishnoi029
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_stats_native.py

      - name: Commit customized SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git add assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update custom animated stats"
          git pull --rebase origin main
          git push
