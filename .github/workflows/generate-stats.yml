name: Generate Stats Assets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Render status bar
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python .github/scripts/render_status.py

      - name: Check file was created
        run: |
          echo "Contents of assets/:"
          ls -la assets/ || echo "assets/ directory does not exist"
          if [ ! -f assets/status-bar.svg ]; then
            echo "::error::status-bar.svg was not generated. Check the 'Render status bar' step log above."
            exit 1
          fi

      - name: Commit status bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/status-bar.svg
          git diff --staged --quiet || git commit -m "chore: update last-shipped status"
          git pull --rebase origin main
          git push

  overview:
    needs: status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-overview.svg
          base: "header, activity, community, repositories, metadata"

      - name: Check file was created
        run: |
          echo "Contents of assets/:"
          ls -la assets/ || echo "assets/ directory does not exist"
          if [ ! -f assets/stats-overview.svg ]; then
            echo "::error::stats-overview.svg was not generated. Check the 'Generate overview SVG' step log above for warnings about token scope."
            exit 1
          fi

      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg
          git diff --staged --quiet || git commit -m "chore: update stats overview"
          git pull --rebase origin main
          git push

  languages:
    needs: overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate languages SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-languages.svg
          base: ""
          plugin_languages: "yes"
          plugin_languages_analysis_timeout: "15"
          plugin_languages_limit: "8"

      - name: Check file was created
        run: |
          echo "Contents of assets/:"
          ls -la assets/ || echo "assets/ directory does not exist"
          if [ ! -f assets/stats-languages.svg ]; then
            echo "::error::stats-languages.svg was not generated. Check the 'Generate languages SVG' step log above for warnings about token scope."
            exit 1
          fi

      - name: Commit languages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update languages stats"
          git pull --rebase origin main
          git push

  activity:
    needs: languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity dashboard SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/activity-dashboard.svg
          base: ""
          plugin_activity: "yes"
          plugin_activity_days: "14"
          plugin_activity_limit: "5"

      - name: Check file was created
        run: |
          echo "Contents of assets/:"
          ls -la assets/ || echo "assets/ directory does not exist"
          if [ ! -f assets/activity-dashboard.svg ]; then
            echo "::error::activity-dashboard.svg was not generated. Check the 'Generate activity dashboard SVG' step log above for warnings about token scope."
            exit 1
          fi

      - name: Commit activity dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dashboard.svg
          git diff --staged --quiet || git commit -m "chore: update activity dashboard"
          git pull --rebase origin main
          git push

  streak:
    needs: activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=parasbishnoi029&disable_animations=true"
          path: "assets/stats-streak.svg"
          token: ${{ secrets.STATS_TOKEN }}

      - name: Check file was created
        run: |
          echo "Contents of assets/:"
          ls -la assets/ || echo "assets/ directory does not exist"
          if [ ! -f assets/stats-streak.svg ]; then
            echo "::error::stats-streak.svg was not generated. Check the 'Generate streak SVG' step log above."
            exit 1
          fi

      - name: Commit streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git pull --rebase origin main
          git push
