name: Generate Stats Assets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  overview-and-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate overview + languages SVGs
        uses: jstrieb/github-stats@master
        with:
          username: parasbishnoi029
          access_token: ${{ secrets.STATS_TOKEN }}
          exclude_repos: ""
          exclude_langs: "HTML,CSS"

      - name: Move & rename into assets/
        run: |
          mkdir -p assets
          mv generated/overview.svg assets/stats-overview.svg
          mv generated/languages.svg assets/stats-languages.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update stats overview + languages"
          git push

  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user_id: "240916957"
          theme: "tokyonight"

      - name: Move into assets/
        run: |
          mkdir -p assets
          mv github-readme-streak-stats.svg assets/stats-streak.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
