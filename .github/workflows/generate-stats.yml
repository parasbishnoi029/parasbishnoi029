name: Generate Stats Assets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-overview.svg
          base: "header, activity, community, repositories, metadata"

      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg
          git diff --staged --quiet || git commit -m "chore: update stats overview"
          git push

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate languages SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-languages.svg
          base: ""
          plugin_languages: "yes"
          plugin_languages_analysis_timeout: "15"
          plugin_languages_limit: "8"

      - name: Commit languages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update languages stats"
          git push

  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=parasbishnoi029&theme=tokyonight&disable_animations=true"
          path: "assets/stats-streak.svg"
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
