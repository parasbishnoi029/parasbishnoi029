name: Generate Stats Assets

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 3am UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Render status bar
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python .github/scripts/render_status.py

      - name: Commit status bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/status-bar.svg
          git diff --staged --quiet || git commit -m "chore: update last-shipped status"
          git pull --rebase origin main
          git push

  overview:
    needs: status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/stats-overview.svg
          base: "header, activity, community, repositories, metadata"

      - name: Commit overview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg
          git diff --staged --quiet || git commit -m "chore: update stats overview"
          git pull --rebase origin main
          git push

  activity:
    needs: overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity dashboard SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: assets/activity-dashboard.svg
          base: ""
          plugin_activity: "yes"
          plugin_activity_days: "14"
          plugin_activity_limit: "5"

      - name: Commit activity dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dashboard.svg
          git diff --staged --quiet || git commit -m "chore: update activity dashboard"
          git pull --rebase origin main
          git push

  custom_designs:
    needs: activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject real stats into custom templates
        run: python .github/scripts/update_custom_svgs.py

      - name: Commit customized SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-streak.svg
          git add assets/stats-languages.svg
          git diff --staged --quiet || git commit -m "chore: update custom animated stats"
          git pull --rebase origin main
          git push
