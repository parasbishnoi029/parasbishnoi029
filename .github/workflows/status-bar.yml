name: Daily Status Bar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest public activity
        id: activity
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          AUTH_HEADER=""
          if [ -n "$GH_TOKEN" ]; then AUTH_HEADER="-H Authorization:\ bearer\ $GH_TOKEN"; fi

          EVENTS=$(curl -s $AUTH_HEADER "https://api.github.com/users/parasbishnoi029/events?per_page=30")
          PUSH=$(echo "$EVENTS" | jq -c '[.[] | select(.type=="PushEvent")][0]')

          FALLBACK_MESSAGES=(
            "Shipping features people forget to say thanks for"
            "Bug fixed. New bug born."
            "Deployed at 2am. No regrets."
            "Coffee-driven development in progress"
            "It works on my machine now"
            "Refactored something nobody asked for"
            "Turning coffee into commits"
            "Merged. Prayed. Deployed."
            "Small fix. Big relief."
            "Wrote docs. Nobody will read them."
            "Chasing an edge case across three timezones"
            "Today's commit message was also chaotic"
          )
          DOY=$(( $(date +%s) / 300 ))
          IDX=$(( 10#$DOY % ${#FALLBACK_MESSAGES[@]} ))
          FALLBACK_MSG="${FALLBACK_MESSAGES[$IDX]}"

          if [ "$PUSH" != "null" ] && [ -n "$PUSH" ]; then
            REPO=$(echo "$PUSH" | jq -r '.repo.name' | cut -d'/' -f2 | cut -c1-20)
            MSG=$(echo "$PUSH" | jq -r '.payload.commits[-1].message // empty' | head -n1)
            CREATED=$(echo "$PUSH" | jq -r '.created_at')
          else
            REPO="daily-log"
            MSG="$FALLBACK_MSG"
            CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          if [ -z "$MSG" ]; then MSG="$FALLBACK_MSG"; fi

          MSG=$(echo "$MSG" | cut -c1-38)
          if [ ${#MSG} -eq 38 ]; then MSG="${MSG}…"; fi

          NOW_EPOCH=$(date -u +%s)
          THEN_EPOCH=$(date -u -d "$CREATED" +%s)
          DIFF=$(( NOW_EPOCH - THEN_EPOCH ))
          if [ $DIFF -lt 3600 ]; then
            REL="$(( DIFF / 60 ))m ago"
          elif [ $DIFF -lt 86400 ]; then
            REL="$(( DIFF / 3600 ))h ago"
          else
            REL="$(( DIFF / 86400 ))d ago"
          fi

          esc() { echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          echo "repo=$(esc "$REPO")" >> "$GITHUB_OUTPUT"
          echo "msg=$(esc "$MSG")" >> "$GITHUB_OUTPUT"
          echo "rel=$(esc "$REL")" >> "$GITHUB_OUTPUT"

      - name: Render status-bar.svg
        env:
          REPO: ${{ steps.activity.outputs.repo }}
          MSG: ${{ steps.activity.outputs.msg }}
          REL: ${{ steps.activity.outputs.rel }}
        run: |
          mkdir -p dist
          echo "" | base64 -d > dist/status-bar.svg
          sed -i "s/__REPO__/${REPO}/g; s/__MSG__/${MSG}/g; s/__REL__/${REL}/g" dist/status-bar.svg
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/status-bar.svg'); print('XML OK')"

      - name: Commit to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          cp dist/status-bar.svg assets/status-bar.svg
          git add assets/status-bar.svg
          if git diff --cached --quiet; then
            echo "no change today"
          else
            git commit -m "chore: daily status update [skip ci]"
            git push origin HEAD:main
          fi
