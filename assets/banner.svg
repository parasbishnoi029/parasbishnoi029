<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Paras Bishnoi, AI developer</title><desc id="desc">A Tokyo Night cyberpunk editorial banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".5" stop-color="#171b2e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".35" stop-color="#7dcfff"/><stop offset=".7" stop-color="#bb9af7"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#bb9af7" stop-opacity=".36"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7aa2f7" fill-opacity=".24"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/><rect width="1600" height="540" fill="url(#dots)"/>
  <circle cx="1280" cy="165" r="310" fill="url(#orb)"/><circle cx="1280" cy="165" r="126" fill="none" stroke="#7aa2f7" stroke-opacity=".42"/><circle cx="1280" cy="165" r="93" fill="none" stroke="#bb9af7" stroke-opacity=".56" stroke-dasharray="3 14"/>
  <path d="M0 420H1600" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/><path d="M0 430C300 355 485 495 790 405S1260 330 1600 400V540H0Z" fill="#7aa2f7" fill-opacity=".06"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="108" y="122" fill="#7dcfff" font-size="19" letter-spacing="7">// DIGITAL CRAFT · 2026</text><text x="100" y="245" fill="#c0caf5" font-size="82" font-weight="700" letter-spacing="-3">PARAS</text><text x="100" y="335" fill="#bb9af7" font-size="82" font-weight="700" letter-spacing="-3">BISHNOI</text><text x="107" y="382" fill="#a9b1d6" font-size="22" letter-spacing="3">AI DEVELOPER · PRODUCT BUILDER</text><text x="108" y="480" fill="#7aa2f7" font-family="monospace" font-size="17">$ craft --with-purpose --ship</text></g>
  <g fill="none" stroke="#7dcfff" stroke-width="2"><path d="M100 80h78M100 80v35"/><path d="M1495 462h-78m78 0v-35"/></g>
  <text x="1219" y="175" fill="#c0caf5" font-family="monospace" font-size="30" text-anchor="middle">&lt; / &gt;</text>
