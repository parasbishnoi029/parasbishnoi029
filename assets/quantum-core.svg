<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Paras Bishnoi — animated 3D data core</title>
  <desc id="desc">A dark futuristic developer banner with a rotating holographic data cube.</desc>
  <defs>
    <linearGradient id="space" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050816"/><stop offset=".48" stop-color="#0b1030"/><stop offset="1" stop-color="#120526"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%"><stop stop-color="#c084fc" stop-opacity=".72"/><stop offset=".35" stop-color="#6366f1" stop-opacity=".3"/><stop offset="1" stop-color="#0b102b" stop-opacity="0"/></radialGradient>
    <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".08"/></linearGradient>
    <linearGradient id="faceB" x1="0" x2="1"><stop stop-color="#a855f7" stop-opacity=".58"/><stop offset="1" stop-color="#ec4899" stop-opacity=".13"/></linearGradient>
    <linearGradient id="faceC" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0ea5e9" stop-opacity=".35"/><stop offset="1" stop-color="#312e81" stop-opacity=".08"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".45" stop-color="#e879f9"/><stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="neon"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity=".075"/></pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#space)"/><rect width="1600" height="720" fill="url(#grid)"/>
  <ellipse cx="1190" cy="370" rx="450" ry="350" fill="url(#glow)" filter="url(#soft)"><animate attributeName="opacity" values=".68;.94;.68" dur="4s" repeatCount="indefinite"/></ellipse>
  <g opacity=".75"><path d="M0 590H1600" stroke="url(#beam)" stroke-width="2" filter="url(#neon)"><animate attributeName="stroke-dasharray" values="20 180;120 80;20 180" dur="5s" repeatCount="indefinite"/></path><path d="M0 625H1600" stroke="#22d3ee" stroke-opacity=".18"/><path d="M1050 720l140-350 165 350M880 720l310-350 330 350" fill="none" stroke="#818cf8" stroke-opacity=".17"/></g>
  <g font-family="Arial, Helvetica, sans-serif"><text x="108" y="126" fill="#67e8f9" font-size="17" letter-spacing="6">// DATA × INTELLIGENCE × CRAFT</text><text x="100" y="245" fill="#f8fafc" font-size="84" font-weight="700" letter-spacing="-4">PARAS</text><text x="100" y="334" fill="#c084fc" font-size="84" font-weight="700" letter-spacing="-4">BISHNOI</text><rect x="106" y="376" width="414" height="1" fill="#a855f7"/><text x="108" y="426" fill="#cbd5e1" font-size="23" letter-spacing="2">SOFTWARE DEVELOPER · ML &amp; DATA</text><text x="108" y="488" fill="#94a3b8" font-family="monospace" font-size="18">building useful systems from raw signals_</text><text x="108" y="590" fill="#64748b" font-family="monospace" font-size="15">STATUS: LEARNING / BUILDING / SHIPPING</text></g>
  <g transform="translate(1185 345)"><animateTransform attributeName="transform" type="rotate" values="0 0 0;2 0 0;0 0 0;-2 0 0;0 0 0" dur="6s" repeatCount="indefinite" additive="sum"/><ellipse cy="168" rx="190" ry="35" fill="#8b5cf6" fill-opacity=".22" filter="url(#soft)"><animate attributeName="rx" values="175;210;175" dur="3s" repeatCount="indefinite"/></ellipse><g filter="url(#neon)"><path d="M0-206L188-98 0 10-188-98Z" fill="url(#faceA)" stroke="#67e8f9" stroke-width="2"/><path d="M-188-98L0 10v217l-188-109Z" fill="url(#faceC)" stroke="#60a5fa" stroke-width="2"/><path d="M0 10L188-98v216L0 227Z" fill="url(#faceB)" stroke="#e879f9" stroke-width="2"/><path d="M0-206V10M-188-98L0 10l188-108" fill="none" stroke="#e0f2fe" stroke-opacity=".7"/><path d="M-140-88L0-8l140-80M-140 80L0 160l140-80" fill="none" stroke="#a5b4fc" stroke-opacity=".35" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" values="0;-60" dur="2.4s" repeatCount="indefinite"/></path></g><g fill="#f0abfc" filter="url(#neon)"><circle cx="0" cy="-206" r="8"><animate attributeName="r" values="7;12;7" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="188" cy="-98" r="7"><animate attributeName="opacity" values=".55;1;.55" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="0" cy="227" r="7"><animate attributeName="opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="-188" cy="-98" r="7"><animate attributeName="r" values="11;6;11" dur="2.3s" repeatCount="indefinite"/></circle></g></g>
  <g fill="#67e8f9" font-family="monospace" font-size="14"><text x="1015" y="112" opacity=".7">[ NEURAL CORE / ONLINE ]</text><text x="1285" y="600" opacity=".65">001101 · 010011 · 101001</text></g>
</svg>
