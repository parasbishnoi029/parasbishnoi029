  <g font-family="Arial, Helvetica, sans-serif"><text x="55" y="65" fill="#7dcfff" font-size="17" letter-spacing="5">SELECTED SYSTEMS / 04</text>
  <g transform="translate(50 105)"><rect width="720" height="205" rx="13" fill="#1a1b2b" stroke="#7aa2f7" stroke-opacity=".7"/><text x="34" y="52" fill="#7aa2f7" font-size="16" letter-spacing="3">01 / DEVELOPER TOOL</text><text x="34" y="113" fill="#c0caf5" font-size="37" font-weight="700">AI REVIEWER</text><text x="34" y="157" fill="#a9b1d6" font-size="18">Better feedback. Earlier fixes.</text><path d="M572 32l105 70-105 70" fill="none" stroke="#7aa2f7" stroke-width="3" filter="url(#g)"/></g>
  <g transform="translate(830 105)"><rect width="720" height="205" rx="13" fill="#1a1b2b" stroke="#bb9af7" stroke-opacity=".7"/><text x="34" y="52" fill="#bb9af7" font-size="16" letter-spacing="3">02 / INTELLIGENCE</text><text x="34" y="113" fill="#c0caf5" font-size="37" font-weight="700">AEGIS AI</text><text x="34" y="157" fill="#a9b1d6" font-size="18">Protection, automation, clarity.</text><circle cx="625" cy="102" r="58" fill="none" stroke="#bb9af7" stroke-width="4"/><path d="M625 58v88m-44-44h88" stroke="#bb9af7" stroke-width="3"/></g>
