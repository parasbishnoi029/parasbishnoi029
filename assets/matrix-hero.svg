<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
      <animate attributeName="r" values="42%;50%;42%" dur="4.5s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="glow" cx="30%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0%;25%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;75%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="titleMask">
      <text x="12.8" y="12.8" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="#ffffff" transform="translate(80,140)">PARAS BISHNOI</text>
    </mask>

    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="botFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="botSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b1878"/>
    </linearGradient>

    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd9b6"/>
      <stop offset="100%" stop-color="#e8b382"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#082018"/>
    </linearGradient>
    <radialGradient id="droneCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>

    <filter id="titleGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b1"/>
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="botGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="screenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="16" fill="url(#bg)"/>

  <g clip-path="url(#frameClip)">
    <circle cx="400" cy="140" r="280" fill="url(#glow)"/>

    <!-- pulsing aura behind the coding scene -->
    <circle cx="900" cy="165" r="170" fill="url(#aura)"/>

    <!-- light ambient particles -->
    <g opacity="0.5">
      <circle cx="620" cy="60" r="1.8" fill="#c4b5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="230" r="1.6" fill="#4ade80"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="70" r="1.6" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="220" r="1.8" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="250" r="1.4" fill="#facc15"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="45" r="1.4" fill="#4ade80"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="0" width="1200" height="300" fill="url(#sheen1)" style="mix-blend-mode:overlay"/>
  </g>

  <path d="M 18 46 L 18 18 L 46 18" fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.5"/>
  <path d="M 1154 18 L 1182 18 L 1182 46" fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.5"/>
  <path d="M 18 254 L 18 282 L 46 282" fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.5"/>
  <path d="M 1154 282 L 1182 282 L 1182 254" fill="none" stroke="#4ade80" stroke-width="1.6" opacity="0.5"/>

  <!-- 3D embossed, colour-gradient title -->
  <g transform="translate(80,140)" filter="url(#titleGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.2s" repeatCount="indefinite"/>
      <text x="12.8" y="12.8" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.95)">PARAS BISHNOI</text>
      <text x="11.2" y="11.2" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.90)">PARAS BISHNOI</text>
      <text x="9.6" y="9.6" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.85)">PARAS BISHNOI</text>
      <text x="8.0" y="8.0" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.80)">PARAS BISHNOI</text>
      <text x="6.4" y="6.4" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.75)">PARAS BISHNOI</text>
      <text x="4.8" y="4.8" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.70)">PARAS BISHNOI</text>
      <text x="3.2" y="3.2" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="rgba(40,20,70,0.65)">PARAS BISHNOI</text>
      <text x="1.6" y="1.6" font-family="Fira Code, monospace" font-weight="800" font-size="70" fill="url(#nameGrad)">PARAS BISHNOI</text>
    </g>
  </g>
  <g clip-path="url(#titleMask)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#sheen1)"/>
  </g>

  <rect x="82" y="176" width="360" height="2" fill="url(#rim)"/>

  <text x="82" y="204" font-family="Fira Code, monospace" font-size="18" letter-spacing="2.5" fill="#a855f7" filter="url(#softGlow)">
    AI ENGINEER <tspan fill="#4ade80">//</tspan> ML <tspan fill="#4ade80">//</tspan> DATA SCIENCE
  </text>

  <!-- rotating greeting line under the name -->
  <g filter="url(#softGlow)">
    <text x="82" y="228" font-family="Fira Code, monospace" font-size="16" fill="#eafff2" opacity="1">Hi there 👋<animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.0000;0.0300;0.2050;0.2500;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="82" y="228" font-family="Fira Code, monospace" font-size="16" fill="#eafff2" opacity="0">Hello, welcome!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2800;0.4550;0.5000;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="82" y="228" font-family="Fira Code, monospace" font-size="16" fill="#eafff2" opacity="0">Namaste 🙏<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5300;0.7050;0.7500;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="82" y="228" font-family="Fira Code, monospace" font-size="16" fill="#eafff2" opacity="0">Good to see you!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7800;0.9550;1.0000;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- ===================== CODING SCENE ===================== -->
  <g transform="translate(900,175)">

    <!-- soft contact shadow -->
    <ellipse cx="0" cy="82" rx="150" ry="12" fill="#000000" opacity="0.35"/>

    <!-- desk -->
    <rect x="-160" y="60" width="320" height="10" rx="3" fill="#1f2937"/>
    <rect x="-160" y="60" width="320" height="3" rx="1.5" fill="#374151"/>

    <!-- drone orbit path (subtle) -->
    <ellipse cx="0" cy="-40" rx="150" ry="60" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="3 6" opacity="0.25"/>

    <!-- ===== person ===== -->
    <g transform="translate(-20,0)">
      <!-- torso / hoodie -->
      <path d="M -46,58 C -46,10 -30,-14 0,-14 C 30,-14 46,10 46,58 L 46,66 L -46,66 Z" fill="url(#hoodie)"/>
      <path d="M -18,-10 C -8,4 8,4 18,-10 L 22,4 C 8,16 -8,16 -22,4 Z" fill="#065f46"/>

      <!-- neck -->
      <rect x="-9" y="-30" width="18" height="16" rx="6" fill="url(#skin)"/>

      <!-- head -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.6s" repeatCount="indefinite"/>
        <circle cx="0" cy="-52" r="26" fill="url(#skin)"/>
        <!-- hair -->
        <path d="M -26,-56 C -28,-78 28,-78 26,-56 C 20,-70 -20,-70 -26,-56 Z" fill="#2d1b12"/>
        <path d="M -27,-52 C -29,-46 -27,-38 -22,-34 L -24,-52 Z" fill="#2d1b12"/>
        <!-- eyes -->
        <ellipse cx="-9" cy="-52" rx="3" ry="3.4" fill="#1f2937">
          <animate attributeName="ry" values="3.4;3.4;0.4;3.4" keyTimes="0;0.9;0.95;1" dur="4.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="9" cy="-52" rx="3" ry="3.4" fill="#1f2937">
          <animate attributeName="ry" values="3.4;3.4;0.4;3.4" keyTimes="0;0.9;0.95;1" dur="4.4s" repeatCount="indefinite"/>
        </ellipse>
        <!-- focused smile -->
        <path d="M -7,-40 Q 0,-36 7,-40" fill="none" stroke="#7c4a2d" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- left arm to keyboard -->
      <g>
        <path d="M -34,26 Q -46,42 -34,54" fill="none" stroke="url(#hoodie)" stroke-width="13" stroke-linecap="round"/>
        <circle cx="-34" cy="54" r="6.5" fill="url(#skin)">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="0.5s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- right arm to keyboard -->
      <g>
        <path d="M 34,26 Q 46,42 20,54" fill="none" stroke="url(#hoodie)" stroke-width="13" stroke-linecap="round"/>
        <circle cx="20" cy="54" r="6.5" fill="url(#skin)">
          <animateTransform attributeName="transform" type="translate" values="0,-2; 0,0; 0,-2" dur="0.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- ===== laptop ===== -->
    <g transform="translate(20,60)">
      <!-- keyboard base -->
      <path d="M -58,0 L 58,0 L 50,10 L -50,10 Z" fill="url(#laptopBody)"/>
      <!-- screen -->
      <path d="M -54,-2 L 54,-2 L 50,-58 L -50,-58 Z" fill="url(#laptopBody)"/>
      <path d="M -46,-6 L 46,-6 L 43,-53 L -43,-53 Z" fill="url(#screenGrad)"/>
      <!-- code lines glowing on screen -->
      <g filter="url(#screenGlow)">
        <rect x="-39" y="-48" width="26" height="3" rx="1.5" fill="#4ade80">
          <animate attributeName="width" values="26;34;26" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="-39" y="-41" width="40" height="3" rx="1.5" fill="#22d3ee" opacity="0.9">
          <animate attributeName="width" values="40;20;40" dur="2.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="-33" y="-34" width="30" height="3" rx="1.5" fill="#a855f7" opacity="0.9">
          <animate attributeName="width" values="30;44;30" dur="2.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="-39" y="-27" width="22" height="3" rx="1.5" fill="#4ade80" opacity="0.85">
          <animate attributeName="width" values="22;32;22" dur="2.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="-33" y="-20" width="18" height="3" rx="1.5" fill="#facc15" opacity="0.85">
          <animate attributeName="width" values="18;28;18" dur="1.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="-39" y="-13" width="3" height="6" fill="#eafff2">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ===== AI buddy bot (floating beside) ===== -->
    <g transform="translate(140,-70) scale(0.6)" filter="url(#botGlow)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3s" repeatCount="indefinite"/>
        <line x1="0" y1="-64" x2="0" y2="-46" stroke="#4ade80" stroke-width="2.5"/>
        <circle cx="0" cy="-68" r="5" fill="#4ade80">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
        <path d="M -38,-40 L 10,-40 L 10,38 L -38,38 Z" fill="url(#botFront)"/>
        <path d="M 10,-40 L 38,-24 L 38,54 L 10,38 Z" fill="url(#botSide)"/>
        <path d="M -38,-40 L 10,-40 L 38,-24 L -10,-24 Z" fill="#e9d5ff"/>
        <ellipse cx="-22" cy="-6" rx="5.5" ry="5.5" fill="#eafff2">
          <animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="-4" cy="-6" rx="5.5" ry="5.5" fill="#eafff2">
          <animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <path d="M -26,14 Q -13,24 0,14" fill="none" stroke="#eafff2" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- speech / thought bubble from bot to laptop -->
    <g opacity="0.8">
      <circle cx="118" cy="-42" r="2.4" fill="#4ade80">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="-30" r="3.2" fill="#4ade80">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="-0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="82" cy="-18" r="4" fill="#4ade80">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== orbiting drone ===== -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 -40" to="360 0 -40" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(150,-40)">
        <!-- counter-rotate keeps drone body upright -->
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7s" repeatCount="indefinite" additive="sum"/>
        <g filter="url(#botGlow)">
          <ellipse cx="-11" cy="-11" rx="9" ry="2.4" fill="#67e8f9" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 -11 -11" to="360 -11 -11" dur="0.25s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="11" cy="-11" rx="9" ry="2.4" fill="#67e8f9" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 11 -11" to="360 11 -11" dur="0.22s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="-11" cy="11" rx="9" ry="2.4" fill="#67e8f9" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 -11 11" to="360 -11 11" dur="0.24s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="11" cy="11" rx="9" ry="2.4" fill="#67e8f9" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 11 11" to="360 11 11" dur="0.23s" repeatCount="indefinite"/>
          </ellipse>
          <line x1="-11" y1="-11" x2="11" y2="11" stroke="#334155" stroke-width="2"/>
          <line x1="11" y1="-11" x2="-11" y2="11" stroke="#334155" stroke-width="2"/>
          <circle cx="0" cy="0" r="7" fill="url(#droneCore)"/>
          <circle cx="0" cy="4" r="2" fill="#dc2626">
            <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>
  </g>
</svg>
