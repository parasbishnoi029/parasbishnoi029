<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Technology orbit</title><desc id="desc">An animated technology orbit around a data and machine learning core.</desc>
  <defs><radialGradient id="b"><stop stop-color="#1e3a8a" stop-opacity=".45"/><stop offset="1" stop-color="#080b18" stop-opacity="0"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.o1{transform-origin:800px 210px;animation:r 20s linear infinite}.o2{transform-origin:800px 210px;animation:r 13s linear infinite reverse}@keyframes r{to{transform:rotate(360deg)}}.p{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.4}}</style>
  <rect width="1600" height="420" rx="18" fill="#080b18"/><ellipse cx="800" cy="210" rx="370" ry="190" fill="url(#b)"/><g fill="none" stroke="#818cf8" stroke-opacity=".32"><ellipse cx="800" cy="210" rx="520" ry="130"/><ellipse cx="800" cy="210" rx="355" ry="180" transform="rotate(-26 800 210)"/><ellipse cx="800" cy="210" rx="355" ry="180" transform="rotate(26 800 210)"/></g>
  <g class="o1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle"><g transform="translate(800 80)"><circle r="37" fill="#0f2745" stroke="#22d3ee"/><text y="5" fill="#67e8f9">PYTHON</text></g><g transform="translate(1120 210)"><circle r="37" fill="#261442" stroke="#c084fc"/><text y="5" fill="#e9d5ff">KOTLIN</text></g><g transform="translate(800 340)"><circle r="37" fill="#102747" stroke="#60a5fa"/><text y="5" fill="#bfdbfe">CLOUD</text></g><g transform="translate(480 210)"><circle r="37" fill="#3a1734" stroke="#f472b6"/><text y="5" fill="#fbcfe8">DATA</text></g></g>
  <g class="o2" font-family="monospace" font-size="13" text-anchor="middle"><g transform="translate(1070 93)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#111a33" stroke="#475569"/><text y="5" fill="#cbd5e1">FASTAPI</text></g><g transform="translate(1060 320)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#111a33" stroke="#475569"/><text y="5" fill="#cbd5e1">PYTORCH</text></g><g transform="translate(540 320)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#111a33" stroke="#475569"/><text y="5" fill="#cbd5e1">PANDAS</text></g><g transform="translate(530 93)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#111a33" stroke="#475569"/><text y="5" fill="#cbd5e1">OPENCV</text></g></g>
  <g filter="url(#g)" class="p"><circle cx="800" cy="210" r="78" fill="#172554" stroke="#67e8f9" stroke-width="2"/><circle cx="800" cy="210" r="59" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 9"/></g><g text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><text x="800" y="202" fill="#f8fafc" font-size="21" font-weight="700">BUILD</text><text x="800" y="227" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="3">USEFUL SYSTEMS</text></g>
  <text x="44" y="52" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="5">ENGINEERING ORBIT</text><text x="1555" y="52" text-anchor="end" fill="#64748b" font-family="monospace" font-size="13">TOOLS CHANGE. FUNDAMENTALS STAY.</text>
</svg>
