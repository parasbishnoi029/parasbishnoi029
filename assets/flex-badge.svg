<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="none"/>

  <!-- ambient glow, pulses -->
  <circle cx="160" cy="95" r="90" fill="url(#glow)">
    <animate attributeName="r" values="80;95;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- grounded shadow, breathes opposite to the coin scale for a 3D-spin illusion -->
  <ellipse cx="160" cy="168" rx="46" ry="10" fill="#000000" opacity="0.25">
    <animate attributeName="rx" values="46;14;46" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.1;0.25" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- the "coin" - scaleX oscillation fakes a Y-axis 3D rotation -->
  <g transform="translate(160,95)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1,1; 0.55,1; 0.05,1; 0.55,1; 1,1"
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        dur="3.2s" repeatCount="indefinite"/>

      <circle r="52" fill="url(#coinRim)"/>
      <circle r="46" fill="url(#coinFace)"/>
      <circle r="46" fill="none" stroke="#f5f3ff" stroke-width="1.5" opacity="0.5"/>

      <text x="0" y="16" font-family="Fira Code, monospace" font-size="34"
            font-weight="700" fill="#ffffff" text-anchor="middle">PB</text>
    </g>
  </g>

  <!-- floating rank text -->
  <text x="160" y="188" font-family="Fira Code, monospace" font-size="12"
        letter-spacing="3" fill="#a855f7" text-anchor="middle" opacity="0.85">
    AI ENGINEER
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
