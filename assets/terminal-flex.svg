<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="60%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1000 0" to="1000 0" dur="2.2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="auraBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animate attributeName="r" values="48%;60%;48%" dur="2.6s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="rain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="75%" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#eafff2" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="megaGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="11" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="460" rx="18"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="460" rx="18" fill="#020308"/>
  <rect x="0" y="0" width="1000" height="460" rx="18" fill="url(#auraBg)"/>

  <!-- ambient sparks -->
  <g>
    <circle cx="80" cy="90" r="2" fill="#4ade80"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="120" r="2.2" fill="#a855f7"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="360" r="1.8" fill="#22d3ee"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="-1.3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="380" r="2" fill="#facc15"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="-0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== SCREEN-SHAKE WRAPPER ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; -6,2; 5,-3; -3,1; 0,0; 0,0; 0,0; 4,-2; -5,3; 2,-1; 0,0; 0,0; 0,0; -4,2; 5,-2; -2,1; 0,0; 0,0"
      keyTimes="0; 0.148; 0.153; 0.157; 0.161; 0.165; 0.348; 0.398; 0.403; 0.407; 0.411; 0.415; 0.598; 0.828; 0.833; 0.837; 0.841; 0.845; 1"
      dur="14s" repeatCount="indefinite"/>

    <!-- window card -->
    <g filter="url(#softShadow)">
      <rect x="30" y="30" width="940" height="400" rx="14" fill="url(#tbg)"/>

      <g clip-path="url(#frame)">
        <!-- matrix rain behind terminal text -->
        <g font-family="Fira Code, monospace" font-size="13" fill="url(#rain)" opacity="0.22">
          <text x="70" y="0">01<animate attributeName="y" values="70;430" dur="2.6s" repeatCount="indefinite"/></text>
          <text x="150" y="0">λ<animate attributeName="y" values="70;430" dur="3.4s" begin="-0.8s" repeatCount="indefinite"/></text>
          <text x="260" y="0">{}<animate attributeName="y" values="70;430" dur="2.9s" begin="-1.4s" repeatCount="indefinite"/></text>
          <text x="420" y="0">10<animate attributeName="y" values="70;430" dur="3.1s" begin="-0.4s" repeatCount="indefinite"/></text>
          <text x="600" y="0">&lt;/&gt;<animate attributeName="y" values="70;430" dur="2.7s" begin="-1.9s" repeatCount="indefinite"/></text>
          <text x="760" y="0">01<animate attributeName="y" values="70;430" dur="3.3s" begin="-0.6s" repeatCount="indefinite"/></text>
          <text x="880" y="0">λ<animate attributeName="y" values="70;430" dur="2.5s" begin="-1.1s" repeatCount="indefinite"/></text>
        </g>

        <!-- glitch static noise bars (flash briefly) -->
        <g>
          <rect x="30" y="140" width="940" height="8" fill="#ff2d55" opacity="0">
            <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.148;0.153;0.158;1" dur="14s" repeatCount="indefinite"/>
          </rect>
          <rect x="30" y="240" width="940" height="6" fill="#22d3ee" opacity="0">
            <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.4;0.405;0.41;1" dur="14s" repeatCount="indefinite"/>
          </rect>
          <rect x="30" y="330" width="940" height="10" fill="#facc15" opacity="0">
            <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.833;0.838;0.843;1" dur="14s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- title bar -->
        <rect x="30" y="30" width="940" height="40" rx="14" fill="url(#titlebar)"/>
        <rect x="30" y="56" width="940" height="14" fill="url(#titlebar)"/>
        <circle cx="56" cy="50" r="6" fill="#ef4444"/>
        <circle cx="76" cy="50" r="6" fill="#facc15"/>
        <circle cx="96" cy="50" r="6" fill="#22c55e"/>
        <text x="500" y="55" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#9ca3af">paras@dev-machine: ~ #root_access</text>
        <circle cx="920" cy="50" r="4" fill="#ef4444">
          <animate attributeName="opacity" values="1;0.25;1" dur="0.7s" repeatCount="indefinite"/>
        </circle>
        <text x="930" y="54" font-family="Fira Code, monospace" font-size="11" fill="#ef4444" letter-spacing="1">LIVE</text>
      </g>

      <rect x="30" y="30" width="940" height="400" rx="14" fill="none" stroke="url(#borderGlow)" stroke-width="2.6"/>
      <rect x="27" y="27" width="946" height="406" rx="16" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.55;0.15" dur="1.6s" repeatCount="indefinite"/>
      </rect>

      <!-- terminal body text -->
      <g font-family="Fira Code, monospace" font-size="17" filter="url(#glow)">
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.0643;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0;0.0643;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="60" y="110" fill="#4ade80">❯ <tspan fill="#e5e7eb">whoami</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0857;0.15;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.0857;0.15;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="76" y="140" fill="#67e8f9">paras-bishnoi &#8226; root</text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1714;0.2357;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.1714;0.2357;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="60" y="176" fill="#4ade80">❯ <tspan fill="#e5e7eb">sudo ./unlock_potential.sh</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2571;0.3214;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.2571;0.3214;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="76" y="206" font-size="15" fill="#a855f7">Skills:<tspan fill="#e5e7eb"> Python &#183; PyTorch &#183; LLMs &#183; MLOps</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3429;0.4071;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.3429;0.4071;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="76" y="232" font-size="15" fill="#facc15">Status:<tspan fill="#4ade80"> UNSTOPPABLE</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4286;0.4929;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.4286;0.4929;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="60" y="268" fill="#4ade80">❯ <tspan fill="#e5e7eb">git commit -m "shipped ML pipeline 🚀"</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5143;0.5786;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.5143;0.5786;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="76" y="298" font-size="15" fill="#facc15">[main a1b2c3d]<tspan fill="#e5e7eb"> shipped ML pipeline 🚀</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.6643;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.6;0.6643;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="60" y="334" fill="#4ade80">❯ <tspan fill="#e5e7eb">./deploy.sh --force</tspan></text>
        </g>
        <g opacity="0" transform="translate(-12,0)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6857;0.75;0.99;1" dur="14s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="-12,0;-12,0;0,0;0,0;-12,0" keyTimes="0;0.6857;0.75;0.99;1" dur="14s" repeatCount="indefinite"/>
          <text x="76" y="364" font-size="15" fill="#67e8f9">Deploying... [██████████] <tspan fill="#4ade80">100%</tspan></text>
        </g>
      </g>

      <!-- ===== CLIMAX: ACCESS GRANTED ===== -->
      <g>
        <!-- white flash -->
        <rect x="30" y="30" width="940" height="400" rx="14" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.828;0.833;0.845;1" dur="14s" repeatCount="indefinite"/>
        </rect>

        <g opacity="0" text-anchor="middle" filter="url(#megaGlow)">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.836;0.85;0.955;0.99" dur="14s" repeatCount="indefinite"/>
          <text x="500" y="255" font-family="Fira Code, monospace" font-weight="800" font-size="40" fill="#4ade80">⚡ ACCESS GRANTED ⚡</text>
        </g>

        <!-- lightning bolts flanking the climax text -->
        <g stroke="#facc15" stroke-width="2.4" fill="none" filter="url(#megaGlow)" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;0.836;0.842;0.848;0.854;0.86;1" dur="14s" repeatCount="indefinite"/>
          <path d="M 190,140 L 165,220 L 195,220 L 160,320"/>
          <path d="M 810,140 L 835,220 L 805,220 L 840,320"/>
        </g>

        <!-- particle burst -->
        <g fill="#4ade80" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.836;0.86;0.93" dur="14s" repeatCount="indefinite"/>
          <circle cx="500" cy="255" r="3"><animate attributeName="cx" values="500;340" keyTimes="0;1" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="255;170" keyTimes="0;1" dur="14s" repeatCount="indefinite"/></circle>
          <circle cx="500" cy="255" r="3" fill="#facc15"><animate attributeName="cx" values="500;660" keyTimes="0;1" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="255;170" keyTimes="0;1" dur="14s" repeatCount="indefinite"/></circle>
          <circle cx="500" cy="255" r="3" fill="#a855f7"><animate attributeName="cx" values="500;340" keyTimes="0;1" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="255;330" keyTimes="0;1" dur="14s" repeatCount="indefinite"/></circle>
          <circle cx="500" cy="255" r="3" fill="#22d3ee"><animate attributeName="cx" values="500;660" keyTimes="0;1" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="255;330" keyTimes="0;1" dur="14s" repeatCount="indefinite"/></circle>
          <circle cx="500" cy="255" r="3"><animate attributeName="cx" values="500;500" keyTimes="0;1" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="255;120" keyTimes="0;1" dur="14s" repeatCount="indefinite"/></circle>
        </g>
      </g>

      <!-- resting blinking cursor -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.96;0.965;0.97;0.975;0.99" dur="14s" repeatCount="indefinite"/>
        <rect x="380" y="384" width="10" height="18" fill="#4ade80" filter="url(#glow)"/>
      </g>
    </g>
  </g>
</svg>
