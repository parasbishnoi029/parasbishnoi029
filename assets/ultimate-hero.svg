<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" role="img" aria-labelledby="title desc">
  <title id="title">Paras Bishnoi — digital systems architect</title>
  <desc id="desc">A self-contained animated 3D developer profile hero in violet, cyan and midnight blue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050713"/><stop offset=".48" stop-color="#0b1232"/><stop offset="1" stop-color="#1c0a36"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".48" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f46e5" stop-opacity=".72"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".26"/><stop offset="1" stop-color="#1e1b4b" stop-opacity=".35"/></linearGradient>
    <linearGradient id="left" x1="0" x2="1"><stop stop-color="#312e81" stop-opacity=".7"/><stop offset="1" stop-color="#0e7490" stop-opacity=".3"/></linearGradient>
    <linearGradient id="right" x1="0" x2="0" y2="1"><stop stop-color="#c084fc" stop-opacity=".55"/><stop offset="1" stop-color="#5b21b6" stop-opacity=".23"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#c084fc" stop-opacity=".4"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <pattern id="mesh" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a5b4fc" stroke-opacity=".07"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .spin { transform-origin: 1195px 355px; animation: spin 16s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .dash { stroke-dasharray: 12 15; animation: dash 4s linear infinite; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .34; transform: scale(1.1); transform-origin: 1195px 355px; } }
    @keyframes dash { to { stroke-dashoffset: -216; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1600" height="730" fill="url(#bg)"/>
  <rect width="1600" height="730" fill="url(#mesh)"/>
  <ellipse cx="1200" cy="350" rx="455" ry="360" fill="url(#halo)" filter="url(#blur)" class="pulse"/>
  <g opacity=".58"><circle cx="1195" cy="355" r="260" fill="none" stroke="#818cf8" stroke-opacity=".25"/><circle cx="1195" cy="355" r="202" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-dasharray="4 16"/><circle cx="1195" cy="355" r="325" fill="none" stroke="#c084fc" stroke-opacity=".16" stroke-dasharray="2 20"/></g>
  <g class="spin" fill="none" stroke="url(#edge)" filter="url(#smallGlow)"><ellipse cx="1195" cy="355" rx="330" ry="130" stroke-width="2"/><ellipse cx="1195" cy="355" rx="230" ry="360" stroke-width="1.5" transform="rotate(55 1195 355)"/><ellipse cx="1195" cy="355" rx="230" ry="360" stroke-width="1.5" transform="rotate(-55 1195 355)"/></g>
  <g transform="translate(1195 355)">
    <animateTransform attributeName="transform" type="translate" values="1195 355;1195 342;1195 355" dur="4.5s" repeatCount="indefinite"/>
    <ellipse cy="225" rx="210" ry="34" fill="#7c3aed" fill-opacity=".2" filter="url(#blur)"/>
    <g filter="url(#glow)">
      <path d="M0-210L200-95V135L0 250-200 135V-95Z" fill="url(#front)" stroke="url(#edge)" stroke-width="2"/>
      <path d="M0-210L200-95 0 20-200-95Z" fill="#1e3a8a" fill-opacity=".3" stroke="#67e8f9" stroke-opacity=".8" stroke-width="2"/>
      <path d="M-200-95L0 20v230l-200-115Z" fill="url(#left)" stroke="#38bdf8" stroke-opacity=".8" stroke-width="2"/>
      <path d="M0 20L200-95v230L0 250Z" fill="url(#right)" stroke="#f0abfc" stroke-opacity=".85" stroke-width="2"/>
      <path d="M0-210V20m-200-115L0 20l200-115M-145-63L0 20l145-83M-145 104L0 187l145-83" fill="none" stroke="#e0f2fe" stroke-opacity=".35" class="dash"/>
      <path d="M-116-48L0 19l116-67M-116 87L0 154l116-67" fill="none" stroke="#c4b5fd" stroke-opacity=".35" stroke-dasharray="3 12"/>
    </g>
    <text x="0" y="53" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700">P/029</text>
    <text x="0" y="84" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="13" letter-spacing="4">DATA CORE</text>
    <g fill="#f0abfc" filter="url(#glow)"><circle cy="-210" r="8"/><circle cx="200" cy="-95" r="7"/><circle cx="0" cy="250" r="7"/><circle cx="-200" cy="-95" r="7"/></g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><text x="105" y="125" fill="#67e8f9" font-size="16" letter-spacing="6">/ SYSTEMS IN MOTION</text><text x="98" y="255" fill="#f8fafc" font-size="87" font-weight="700" letter-spacing="-4">PARAS</text><text x="98" y="347" fill="#c084fc" font-size="87" font-weight="700" letter-spacing="-4">BISHNOI</text><path d="M105 383H595" stroke="url(#edge)" stroke-width="2" filter="url(#smallGlow)"/><text x="105" y="434" fill="#cbd5e1" font-size="23" letter-spacing="2">SOFTWARE DEVELOPER</text><text x="105" y="471" fill="#94a3b8" font-size="19" letter-spacing="1">MACHINE LEARNING · DATA · APPLICATIONS</text><text x="106" y="571" fill="#a5b4fc" font-family="monospace" font-size="17">$ transform(data) → useful_product<tspan class="blink">_</tspan></text><text x="106" y="626" fill="#64748b" font-family="monospace" font-size="14">SIGNAL: BUILDING · LEARNING · SHIPPING</text></g>
  <g fill="#67e8f9" font-family="monospace" font-size="13" opacity=".7"><text x="1015" y="90">[ 3D WORKSPACE / ONLINE ]</text><text x="1335" y="650">01010000 · 00110010 · 00111001</text></g>
  <path d="M0 678H1600" stroke="url(#edge)" stroke-opacity=".5"/><g stroke="#67e8f9" stroke-opacity=".55" fill="none"><path d="M72 91h46v-28M1528 638h-46v28"/></g>
</svg>
