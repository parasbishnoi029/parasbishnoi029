<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc"><title id="title">Contribution snake</title><desc id="desc">Animated placeholder for the automatically generated contribution snake.</desc><defs><linearGradient id="s" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.dash{stroke-dasharray:14 18;animation:d 2.5s linear infinite}@keyframes d{to{stroke-dashoffset:-192}}.eye{animation:e 1.2s step-end infinite}@keyframes e{50%{opacity:.15}}</style><rect width="1600" height="250" rx="18" fill="#090d1d"/><text x="60" y="61" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="5">CONTRIBUTION SNAKE / AUTO-REFRESHING</text><path d="M100 163C245 51 356 215 500 145S758 81 875 153s261 69 356-10 212-45 277 14" fill="none" stroke="url(#s)" stroke-width="21" stroke-linecap="round" filter="url(#g)"/><path d="M100 163C245 51 356 215 500 145S758 81 875 153s261 69 356-10 212-45 277 14" fill="none" stroke="#f8fafc" stroke-opacity=".35" stroke-width="3" class="dash"/><g transform="translate(1510 156)"><path d="M0 0l41-19v38z" fill="#f472b6" filter="url(#g)"/><circle cx="29" cy="-6" r="3" fill="#f8fafc" class="eye"/></g><text x="60" y="215" fill="#94a3b8" font-family="monospace" font-size="13">LIVE CONTRIBUTION DATA REPLACES THIS ASSET AFTER THE FIRST WORKFLOW RUN.</text></svg>
