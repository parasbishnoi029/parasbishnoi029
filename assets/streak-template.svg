<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
     viewBox='0 0 495 195' width='495px' height='195px' direction='ltr'>

  <defs>
    <clipPath id='outer_rectangle'>
      <rect width='495' height='195' rx='10'/>
    </clipPath>
    <mask id='mask_out_ring_behind_fire'>
      <rect width='495' height='195' fill='white'/>
      <ellipse cx='247.5' cy='34' rx='15' ry='20' fill='black'/>
    </mask>

    <linearGradient id='cardBg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#050810'/>
      <stop offset='55%' stop-color='#0a0f1e'/>
      <stop offset='100%' stop-color='#1a1030'/>
    </linearGradient>
    <radialGradient id='cardAura' cx='50%' cy='40%' r='65%'>
      <stop offset='0%' stop-color='#a855f7' stop-opacity='0.22'/>
      <stop offset='100%' stop-color='#a855f7' stop-opacity='0'/>
      <animate attributeName='r' values='55%;68%;55%' dur='3.5s' repeatCount='indefinite'/>
    </radialGradient>
    <linearGradient id='numGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#4ade80'/>
      <stop offset='100%' stop-color='#22d3ee'/>
    </linearGradient>
    <linearGradient id='streakNumGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#facc15'/>
      <stop offset='100%' stop-color='#fb923c'/>
    </linearGradient>
    <linearGradient id='ringGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#facc15'/>
      <stop offset='50%' stop-color='#fb923c'/>
      <stop offset='100%' stop-color='#facc15'/>
    </linearGradient>
    <linearGradient id='divider' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#4ade80' stop-opacity='0'/>
      <stop offset='50%' stop-color='#a855f7' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#4ade80' stop-opacity='0'/>
    </linearGradient>

    <filter id='softGlow' x='-60%' y='-60%' width='220%' height='220%'>
      <feGaussianBlur stdDeviation='1.6' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='fireGlow' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='2.2' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <g clip-path='url(#outer_rectangle)'>
    <rect width='495' height='195' fill='url(#cardBg)'/>
    <rect width='495' height='195' fill='url(#cardAura)'/>
    <rect x='1' y='1' width='493' height='193' rx='9' fill='none' stroke='#a855f7' stroke-opacity='0.35' stroke-width='1'/>

    <g>
      <circle cx='30' cy='24' r='1.4' fill='#4ade80'><animate attributeName='opacity' values='0.15;1;0.15' dur='2.6s' repeatCount='indefinite'/></circle>
      <circle cx='465' cy='30' r='1.3' fill='#22d3ee'><animate attributeName='opacity' values='0.15;1;0.15' dur='3.1s' begin='-1s' repeatCount='indefinite'/></circle>
      <circle cx='40' cy='168' r='1.4' fill='#a855f7'><animate attributeName='opacity' values='0.15;1;0.15' dur='2.8s' begin='-1.6s' repeatCount='indefinite'/></circle>
      <circle cx='458' cy='170' r='1.3' fill='#facc15'><animate attributeName='opacity' values='0.15;1;0.15' dur='3.3s' begin='-0.5s' repeatCount='indefinite'/></circle>
    </g>

    <line x1='165' y1='24' x2='165' y2='172' stroke='url(#divider)' stroke-width='1.2'/>
    <line x1='330' y1='24' x2='330' y2='172' stroke='url(#divider)' stroke-width='1.2'/>

    <!-- TOTAL CONTRIBUTIONS -->
    <g text-anchor='middle' filter='url(#softGlow)'>
      <text x='82.5' y='80' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='800' font-size='30' fill='url(#numGrad)'>{{TOTAL_COMMITS}}</text>
    </g>
    <text x='82.5' y='116' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='500' font-size='13' fill='#e5e7eb' letter-spacing='0.4'>Total Contributions</text>
    <text x='82.5' y='146' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='11' fill='#9ca3af'>{{TOTAL_DATES}}</text>

    <!-- CURRENT STREAK -->
    <text x='247.5' y='140' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='13' fill='#fb923c' letter-spacing='0.5'>CURRENT STREAK</text>
    <text x='247.5' y='166' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='11' fill='#9ca3af'>{{CURRENT_DATES}}</text>

    <g mask='url(#mask_out_ring_behind_fire)'>
      <circle cx='247.5' cy='73' r='42' fill='none' stroke='#3b2f14' stroke-width='6'/>
      <circle cx='247.5' cy='73' r='42' fill='none' stroke='url(#ringGrad)' stroke-width='6' stroke-linecap='round' filter='url(#softGlow)'>
        <animate attributeName='stroke-dasharray' values='0 264;264 264' dur='1.6s' fill='freeze'/>
      </circle>
      <circle cx='247.5' cy='73' r='50' fill='none' stroke='#facc15' stroke-width='1' stroke-dasharray='2 8' opacity='0.5'>
        <animateTransform attributeName='transform' type='rotate' from='0 247.5 73' to='360 247.5 73' dur='8s' repeatCount='indefinite'/>
      </circle>
    </g>

    <g transform='translate(247.5, 21)' filter='url(#fireGlow)'>
      <g>
        <animateTransform attributeName='transform' type='scale' values='1;1.08;0.97;1.04;1' dur='1.3s' repeatCount='indefinite'/>
        <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#facc15'/>
      </g>
    </g>

    <g text-anchor='middle' filter='url(#softGlow)'>
      <text x='247.5' y='80' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='800' font-size='30' fill='url(#streakNumGrad)'>{{CURRENT_STREAK}}</text>
    </g>

    <!-- LONGEST STREAK -->
    <g text-anchor='middle' filter='url(#softGlow)'>
      <text x='412.5' y='80' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='800' font-size='30' fill='url(#numGrad)'>{{LONGEST_STREAK}}</text>
    </g>
    <g transform='translate(412.5, 12)' fill='#facc15' filter='url(#softGlow)'>
      <path d='M -6,0 L 6,0 L 5.3,5.5 C 4.8,8.5 2.6,10.2 0,10.2 C -2.6,10.2 -4.8,8.5 -5.3,5.5 Z'/>
      <path d='M -6,1 C -9,1 -9.5,5 -6.5,5.5' fill='none' stroke='#facc15' stroke-width='1.2'/>
      <path d='M 6,1 C 9,1 9.5,5 6.5,5.5' fill='none' stroke='#facc15' stroke-width='1.2'/>
      <rect x='-1.6' y='10' width='3.2' height='3' />
      <rect x='-4' y='13' width='8' height='2' rx='1'/>
    </g>
    <text x='412.5' y='116' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='500' font-size='13' fill='#e5e7eb' letter-spacing='0.4'>Longest Streak</text>
    <text x='412.5' y='146' text-anchor='middle' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='11' fill='#9ca3af'>{{LONGEST_DATES}}</text>
  </g>
</svg>
