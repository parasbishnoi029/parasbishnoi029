<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 300" width="495px" height="300px">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="55%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="cardAura" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
      <animate attributeName="r" values="60%;74%;60%" dur="3.6s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-460 0" to="460 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="barGrow">
      <rect x="0" y="0" height="10" width="0" rx="5">
        <animate attributeName="width" values="0;460;460" keyTimes="0;0.5;1" dur="3.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cardClip"><rect width="495" height="300" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="495" height="300" fill="url(#cardBg)"/>
    <rect width="495" height="300" fill="url(#cardAura)"/>
    <rect x="1" y="1" width="493" height="298" rx="11" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1"/>

    <g>
      <circle cx="26" cy="20" r="1.3" fill="#4ade80"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="468" cy="26" r="1.3" fill="#22d3ee"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="270" r="1.3" fill="#facc15"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="22" cy="270" r="1.3" fill="#a855f7"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="-0.5s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(24,32)" filter="url(#softGlow)">
      <path transform="translate(0,-14) scale(1.1)" fill="#4ade80" fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75z"/>
      <text x="24" y="0" font-family="-apple-system,Segoe UI,Ubuntu,sans-serif" font-weight="700" font-size="17" fill="url(#titleGrad)">Top Languages</text>
    </g>
    <text x="24" y="58" font-family="-apple-system,Segoe UI,Ubuntu,sans-serif" font-weight="500" font-size="12" fill="#9ca3af" letter-spacing="0.5">MOST USED LANGUAGES</text>

    <!-- Top Gradient Bar -->
    <g transform="translate(17,66)">
      <rect x="0" y="0" width="460" height="10" rx="5" fill="#1f2937"/>
      <g clip-path="url(#barGrow)">
        <rect x="0.00" y="0" width="394.83" height="10" fill="#3178c6"/>
        <rect x="394.83" y="0" width="18.09" height="10" fill="#e34c26"/>
        <rect x="412.92" y="0" width="16.25" height="10" fill="#A97BFF"/>
        <rect x="429.18" y="0" width="10.43" height="10" fill="#336790"/>
        <rect x="439.61" y="0" width="10.40" height="10" fill="#3572A5"/>
        <rect x="450.01" y="0" width="6.88" height="10" fill="#f1e05a"/>
        <rect x="0" y="0" width="460" height="10" fill="url(#barSheen)"/>
      </g>
      <rect x="0" y="0" width="460" height="10" rx="5" fill="none" stroke="#000" stroke-opacity="0.25"/>
    </g>

    <!-- Detailed Rows -->
    <g font-family="-apple-system,Segoe UI,Ubuntu,sans-serif" font-size="13.5" fill="#e5e7eb">
      <!-- LANG 1 -->
      <g transform="translate(24,108)">
        <circle cx="6" cy="-4" r="5" fill="#3178c6" filter="url(#softGlow)"/>
        <text x="20" y="0">TypeScript</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#3178c6"><animate attributeName="width" values="0;154.50" dur="1.4s" begin="0.3s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">85.8%</text>
      </g>
      <!-- LANG 2 -->
      <g transform="translate(24,138)">
        <circle cx="6" cy="-4" r="5" fill="#e34c26" filter="url(#softGlow)"/>
        <text x="20" y="0">HTML</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#e34c26"><animate attributeName="width" values="0;7.08" dur="1.4s" begin="0.45s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">3.9%</text>
      </g>
      <!-- LANG 3 -->
      <g transform="translate(24,168)">
        <circle cx="6" cy="-4" r="5" fill="#A97BFF" filter="url(#softGlow)"/>
        <text x="20" y="0">Kotlin</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#A97BFF"><animate attributeName="width" values="0;6.36" dur="1.4s" begin="0.6s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">3.5%</text>
      </g>
      <!-- LANG 4 -->
      <g transform="translate(24,198)">
        <circle cx="6" cy="-4" r="5" fill="#336790" filter="url(#softGlow)"/>
        <text x="20" y="0">PLpgSQL</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#336790"><animate attributeName="width" values="0;4.08" dur="1.4s" begin="0.75s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">2.3%</text>
      </g>
      <!-- LANG 5 -->
      <g transform="translate(24,228)">
        <circle cx="6" cy="-4" r="5" fill="#3572A5" filter="url(#softGlow)"/>
        <text x="20" y="0">Python</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#3572A5"><animate attributeName="width" values="0;4.07" dur="1.4s" begin="0.9s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">2.3%</text>
      </g>
      <!-- LANG 6 -->
      <g transform="translate(24,258)">
        <circle cx="6" cy="-4" r="5" fill="#f1e05a" filter="url(#softGlow)"/>
        <text x="20" y="0">JavaScript</text>
        <rect x="220" y="-11" width="180" height="6" rx="3" fill="#1f2937"/>
        <rect x="220" y="-11" height="6" rx="3" fill="#f1e05a"><animate attributeName="width" values="0;2.69" dur="1.4s" begin="1.05s" fill="freeze"/></rect>
        <text x="450" y="0" text-anchor="end" fill="#9ca3af">1.5%</text>
      </g>
    </g>
  </g>
</svg>
